[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfheal"
version = "1.0.0"
description = "AI-Powered Self-Healing Test Automation Framework (OpenAI + Anthropic)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AI Test Automation Team", email = "support@selfheal.dev"}
]
keywords = ["testing", "automation", "ai", "self-healing", "openai", "anthropic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software :: Testing",
    "Topic :: Software :: Testing :: Acceptance",
]

# Core dependencies
dependencies = [
    # LLM APIs (both supported)
    "anthropic>=0.18.0",  # Anthropic Claude API
    "openai>=1.3.0",      # OpenAI ChatGPT API (NEW)
    
    # Web Automation
    "playwright>=1.40.0",
    
    # Data & Config
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    
    # Excel I/O
    "openpyxl>=3.1.0",
    
    # CLI
    "typer[all]>=0.9.0",
    
    # Database
    # (SQLite is built-in to Python)
    
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    
    # Code Quality
    "ruff>=0.1.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.4.0",
    "ruff>=0.1.0",
]

docker = [
    "docker>=6.1.0",
]

[project.scripts]
selfheal = "selfheal.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["selfheal*"]

[tool.setuptools.package-data]
selfheal = [
    "prompts/*.txt",
    "config/*.yaml",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/selfheal"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.isort]
known-first-party = ["selfheal"]
