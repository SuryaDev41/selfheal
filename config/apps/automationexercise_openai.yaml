# Browser-test configuration for automationexercise.com.
# Secrets and test-account details belong in the ignored .env file.

app_name: automationexercise

dashboard:
  visible: true

llm:
  model: gpt-3.5-turbo

environments:
  prod:
    base_url: https://www.automationexercise.com
    account:
      email: ""
      password: ""
  staging:
    base_url: https://www.automationexercise.com
    account:
      email: ""
      password: ""
  dev:
    base_url: https://www.automationexercise.com
    account:
      email: ""
      password: ""

registration:
  default_title: Mr

# Semantic Playwright lookup always runs first. This section governs the
# fallback path: verified locator cache, then an OpenAI locator suggestion.
resolver:
  ai_enabled: true
  confidence_threshold: 0.85

healing:
  enabled: true
  auto_approve: false
  confidence_threshold: 0.85
  max_heals_per_run: 50
  cache_path: data/store/elements.db

execution:
  browser: chromium
  timeout_seconds: 30
  delay_between_cases_seconds: 1
  screenshot_on_error: true
  screenshot_on_pass: true
  blocked_resource_host_suffixes:
    - googlesyndication.com
    - doubleclick.net
    - adtrafficquality.google
    - fundingchoicesmessages.google.com

safety:
  no_real_payments: true
  demo_orders:
    enabled: true
    hosts:
      - www.automationexercise.com
    card_numbers:
      - "4111111111111111"

verification:
  max_home_load_seconds: 15
